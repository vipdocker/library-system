# 测试 profile：无种子数据、关闭 AdminBootstrap。
# 数据源 URL 由 IntegrationTestBase 的 @DynamicPropertySource 指向每 JVM 一个的临时文件数据库。
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: com.example.library.common.config.LibrarySQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

lib:
  seed:
    demo: false
  admin:
    bootstrap: false

logging:
  level:
    root: WARN
    com.example.library: INFO