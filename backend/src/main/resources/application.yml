server:
  port: ${SERVER_PORT:18095}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  profiles:
    default: dev
  datasource:
    url: jdbc:sqlite:${LIB_DB_PATH:./data/library.db}?foreign_keys=true&busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    database-platform: com.example.library.common.config.LibrarySQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

lib:
  timezone: ${LIB_TIMEZONE:Asia/Shanghai}
  loan:
    max-active-loans: ${LIB_MAX_ACTIVE_LOANS:5}
    loan-days: ${LIB_LOAN_DAYS:30}
    max-renewals: ${LIB_MAX_RENEWALS:1}
    renew-days: ${LIB_RENEW_DAYS:30}
    reader-self-renew: ${LIB_READER_SELF_RENEW:false}
  admin:
    username: ${LIB_ADMIN_USERNAME:admin}
    initial-password: ${LIB_ADMIN_PASSWORD:}
    bootstrap: true
  seed:
    demo: false
  open-library:
    app-name: ${LIB_OPEN_LIBRARY_APP_NAME:LibraryCatalog}
    # Maven resource filtering (spring-boot-starter-parent, @ delimiter) injects the real project version.
    app-version: "@project.version@"
    # Optional; sent only to openlibrary.org in the User-Agent. Empty = anonymous (still 1 request/second).
    contact-email: ${LIB_OPEN_LIBRARY_CONTACT_EMAIL:}
    direct-failure-ttl: ${LIB_OPEN_LIBRARY_DIRECT_FAILURE_TTL:PT30S}

logging:
  level:
    root: INFO
    # Upstream connection errors are reported by OpenLibraryClient as sanitized enums; this exact logger echoes peer/proxy addresses.
    reactor.netty.http.client.HttpClientConnect: OFF